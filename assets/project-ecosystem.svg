<svg viewBox="0 0 1200 920" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shayan Ostovar project ecosystem map">
<style>
:root{--bg:#ffffff;--ink:#111827;--muted:#6b7280;--rule:#d1d5db;--accent:#2563eb;--core:#f8fafc;--node:#ffffff}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#f0f6fc;--muted:#8b949e;--rule:#30363d;--accent:#58a6ff;--core:#161b22;--node:#0d1117}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.wire{stroke:var(--rule);stroke-width:1.2;stroke-dasharray:800;stroke-dashoffset:800;animation:draw 1.8s ease forwards}
.flow{stroke:var(--accent);stroke-width:1;stroke-dasharray:4 12;opacity:.35;animation:flow 1.8s linear infinite}
.node{fill:var(--node);stroke:var(--rule);stroke-width:1}
.core{fill:var(--core);stroke:var(--accent);stroke-width:1.5}
.pop{opacity:0;animation:pop .55s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-16}}@keyframes pop{to{opacity:1}}
.p1{animation-delay:.15s}.p2{animation-delay:.3s}.p3{animation-delay:.45s}.p4{animation-delay:.6s}.p5{animation-delay:.75s}.p6{animation-delay:.9s}
@media(prefers-reduced-motion:reduce){.wire,.flow,.pop{animation:none;stroke-dashoffset:0;opacity:1}}
</style>
<rect width="1200" height="920" rx="22" fill="var(--bg)"/>
<text x="54" y="38" class="mono" fill="var(--muted)" font-size="12" letter-spacing="3">PROJECT ECOSYSTEM — BUSINESS ANALYSIS × AI × SOFTWARE × AUTOMATION</text>
<text x="1146" y="38" class="mono" fill="var(--muted)" font-size="12" text-anchor="end">SHAYAN OSTOVAR</text>
<line x1="54" y1="52" x2="1146" y2="52" stroke="var(--rule)"/>

<!-- cluster-to-core wires -->
<g>
<line class="wire" x1="600" y1="425" x2="245" y2="185"/>
<line class="wire" x1="600" y1="425" x2="955" y2="185"/>
<line class="wire" x1="600" y1="425" x2="230" y2="650"/>
<line class="wire" x1="600" y1="425" x2="970" y2="650"/>
<line class="wire" x1="600" y1="425" x2="600" y2="790"/>
<line class="flow" x1="600" y1="425" x2="245" y2="185"/>
<line class="flow" x1="600" y1="425" x2="955" y2="185"/>
<line class="flow" x1="600" y1="425" x2="230" y2="650"/>
<line class="flow" x1="600" y1="425" x2="970" y2="650"/>
<line class="flow" x1="600" y1="425" x2="600" y2="790"/>
</g>

<!-- core -->
<g class="pop p1">
<rect class="core" x="430" y="365" width="340" height="120" rx="10"/>
<text x="600" y="403" text-anchor="middle" class="mono" fill="var(--ink)" font-size="19" font-weight="700" letter-spacing="1.5">ICT BUSINESS ANALYSIS</text>
<text x="600" y="431" text-anchor="middle" class="mono" fill="var(--accent)" font-size="13">AI · SOFTWARE · AUTOMATION</text>
<text x="600" y="456" text-anchor="middle" class="mono" fill="var(--muted)" font-size="11">process optimization → practical systems</text>
</g>

<!-- AI cluster -->
<g class="pop p2">
<text x="245" y="92" text-anchor="middle" class="mono" fill="var(--accent)" font-size="12" letter-spacing="2.5">AI &amp; INTELLIGENT SYSTEMS</text>
<rect class="node" x="70" y="115" width="350" height="56" rx="6"/><text x="245" y="139" text-anchor="middle" class="mono" fill="var(--ink)" font-size="13" font-weight="700">Kherad AI Platform</text><text x="245" y="158" text-anchor="middle" class="mono" fill="var(--muted)" font-size="9.5">local LLMs · GPU orchestration · multimodal AI</text>
<rect class="node" x="70" y="181" width="350" height="56" rx="6"/><text x="245" y="205" text-anchor="middle" class="mono" fill="var(--ink)" font-size="13" font-weight="700">RasafamCRM AI</text><text x="245" y="224" text-anchor="middle" class="mono" fill="var(--muted)" font-size="9.5">RAG · OCR · structured extraction · automation</text>
<rect class="node" x="70" y="247" width="350" height="48" rx="6"/><text x="245" y="277" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">TravelTechCrm-WorkFlowOptimization</text>
<rect class="node" x="70" y="305" width="350" height="48" rx="6"/><text x="245" y="335" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">FaranegarBehavior</text>
</g>

<!-- Business cluster -->
<g class="pop p3">
<text x="955" y="92" text-anchor="middle" class="mono" fill="var(--accent)" font-size="12" letter-spacing="2.5">BUSINESS SYSTEMS</text>
<rect class="node" x="780" y="115" width="350" height="48" rx="6"/><text x="955" y="145" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">FaranegarCrmMvc</text>
<rect class="node" x="780" y="173" width="350" height="48" rx="6"/><text x="955" y="203" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">CustomerClub</text>
<rect class="node" x="780" y="231" width="350" height="48" rx="6"/><text x="955" y="261" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">SalesFunnel</text>
<rect class="node" x="780" y="289" width="350" height="48" rx="6"/><text x="955" y="319" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">Atris</text>
</g>

<!-- Travel cluster -->
<g class="pop p4">
<text x="230" y="555" text-anchor="middle" class="mono" fill="var(--accent)" font-size="12" letter-spacing="2.5">TRAVEL TECH &amp; OPERATIONS</text>
<rect class="node" x="55" y="580" width="350" height="45" rx="6"/><text x="230" y="608" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">ParastooSeir</text>
<rect class="node" x="55" y="635" width="350" height="45" rx="6"/><text x="230" y="663" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">ParastooVoucher</text>
<rect class="node" x="55" y="690" width="350" height="45" rx="6"/><text x="230" y="718" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">FlightSyncPS</text>
<rect class="node" x="55" y="745" width="350" height="45" rx="6"/><text x="230" y="773" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">ParsVtIntegrator</text>
<rect class="node" x="55" y="800" width="168" height="45" rx="6"/><text x="139" y="828" text-anchor="middle" class="mono" fill="var(--ink)" font-size="10.5">PouyaGen2</text>
<rect class="node" x="237" y="800" width="168" height="45" rx="6"/><text x="321" y="828" text-anchor="middle" class="mono" fill="var(--ink)" font-size="10.5">PSUpdated</text>
</g>

<!-- Digital products -->
<g class="pop p5">
<text x="970" y="555" text-anchor="middle" class="mono" fill="var(--accent)" font-size="12" letter-spacing="2.5">DIGITAL PRODUCTS &amp; WEB</text>
<rect class="node" x="795" y="580" width="350" height="45" rx="6"/><text x="970" y="608" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">4U-Group</text>
<rect class="node" x="795" y="635" width="350" height="56" rx="6"/><text x="970" y="657" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">4U-Group EnergySharing</text><text x="970" y="677" text-anchor="middle" class="mono" fill="var(--muted)" font-size="9.5">consumer · provider · admin matching platform</text>
<rect class="node" x="795" y="701" width="350" height="45" rx="6"/><text x="970" y="729" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">DanialPardazWebsite</text>
<rect class="node" x="795" y="756" width="350" height="45" rx="6"/><text x="970" y="784" text-anchor="middle" class="mono" fill="var(--ink)" font-size="11.5">visa-frontend</text>
</g>

<!-- experiments -->
<g class="pop p6">
<text x="600" y="735" text-anchor="middle" class="mono" fill="var(--accent)" font-size="12" letter-spacing="2.5">EXPERIMENTS &amp; LEGACY</text>
<rect class="node" x="445" y="755" width="310" height="42" rx="6"/><text x="600" y="781" text-anchor="middle" class="mono" fill="var(--ink)" font-size="10.5">Fal-e-HafezGenerator-YaldaNight</text>
<rect class="node" x="445" y="807" width="150" height="42" rx="6"/><text x="520" y="833" text-anchor="middle" class="mono" fill="var(--ink)" font-size="10.5">MagiskOnWSA</text>
<rect class="node" x="605" y="807" width="150" height="42" rx="6"/><text x="680" y="833" text-anchor="middle" class="mono" fill="var(--ink)" font-size="10.5">CustomerClubOld</text>
<rect class="node" x="445" y="859" width="150" height="42" rx="6"/><text x="520" y="885" text-anchor="middle" class="mono" fill="var(--ink)" font-size="10.5">PouyaOld</text>
<rect class="node" x="605" y="859" width="150" height="42" rx="6"/><text x="680" y="885" text-anchor="middle" class="mono" fill="var(--ink)" font-size="10.5">profile / lab</text>
</g>
</svg>