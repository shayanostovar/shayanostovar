name: Profile Auto Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_profile.py'
      - 'profile-projects.json'
      - '.github/workflows/profile-sync.yml'

permissions:
  contents: write

concurrency:
  group: profile-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Sync public repositories and generate project map
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py

      - name: Commit refreshed public profile
        run: |
          if git diff --quiet -- README.md assets/project-ecosystem.svg; then
            echo "Profile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/project-ecosystem.svg
          git commit -m "profile: refresh public project showcase"
          git push
