name: Profile Auto Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_profile.py'
      - 'profile-projects.json'
      - '.github/workflows/profile-sync.yml'

permissions:
  contents: write

concurrency:
  group: profile-auto-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate dynamic profile sections and ecosystem map
        env:
          PROFILE_REPO_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py

      - name: Commit profile changes
        run: |
          if git diff --quiet; then
            echo "Profile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/project-ecosystem.svg profile-projects.json
          git commit -m "profile: auto-sync repositories and ecosystem"
          git push
