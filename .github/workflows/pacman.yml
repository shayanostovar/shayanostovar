name: pacman

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pacman
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@d258e3fb01511c1ff4fe6418408ede37b2ad4935
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: 'pacman: update contribution graph'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
